[package]
name = "ocio-sys"
version = "0.2.1"
edition = "2021"
authors = ["shaloong <contact@shaloong.com>"]
description = "Low-level FFI bindings for OpenColorIO v2.5.2"
license = "BSD-3-Clause"
repository = "https://github.com/shaloong/ocio-rs"
links = "OpenColorIO"
build = "build.rs"

[dependencies]

[build-dependencies]
cc = "1.0"
cmake = { version = "0.1", optional = true }
system-deps = "7"

[features]
default = []
# Registers a from-source CMake build as a fallback via system-deps'
# add_build_internal, used when pkg-config doesn't find OpenColorIO. See
# SYSTEM_DEPS_OPENCOLORIO_BUILD_INTERNAL to control when it runs.
bundled = ["dep:cmake"]

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.system-deps.opencolorio]
name = "OpenColorIO"
version = "2.5.2"
