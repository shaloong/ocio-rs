name: Bug report
description: Report a reproducible problem in the Rust bindings, bridge, build, or docs.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      options:
        - Stub mode
        - Real installed OCIO
        - Bundled OCIO
        - Packaging / release flow
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Crate version, branch, or commit SHA
      placeholder: 0.2.1-dev / main / abc1234

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include commands, config snippets, and test cases if possible.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust toolchain, OCIO version, and anything else relevant.
      render: text
