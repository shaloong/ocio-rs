name: Sanitizers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    name: AddressSanitizer (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
      CFLAGS: -fsanitize=address -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      RUSTFLAGS: -Zsanitizer=address -C debuginfo=1
      # Separate target instrumentation from host build scripts/proc macros.
      # Nested Cargo probes in build_configuration.rs inherit this as well.
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install C++ compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ llvm

      - name: Test with AddressSanitizer
        run: cargo test --workspace --no-default-features --features v2_5
