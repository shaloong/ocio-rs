name: Main branch policy

on:
  pull_request:
    branches:
      - main

# This privileged event intentionally does not check out or execute pull request
# code. The policy must run from the trusted default branch.
permissions: {}

jobs:
  require-develop:
    name: Main accepts develop only
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request source
        run: echo "Untrusted branch attempted to bypass the source policy."
