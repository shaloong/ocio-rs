name: Release Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build powershell

      - name: Run release audit
        # Populate Cargo's cache before checking offline package/native builds.
        # The audit itself must not depend on already-published sibling crates.
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed" }
          ./tools/release_audit.ps1 -IncludeBundled -IncludeTopLevelPackage -Offline

      - name: Retain release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: target/release-audit/**/*.crate
          if-no-files-found: error
