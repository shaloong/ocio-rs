name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    name: Stub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Test baseline interface
        run: cargo test --workspace --no-default-features

      - name: Test v2_5 interface
        run: cargo test --workspace --no-default-features --features v2_5

      - name: Test examples
        run: cargo test --examples --no-default-features

  stub-audit:
    name: Stub Audit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features v2_5 -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --no-default-features --features v2_5

      - name: Parity
        run: cargo run --bin check_parity --quiet -- --check-l3

      - name: Package
        run: cargo package -p ocio-sys --allow-dirty

  system-ocio:
    # A representative 2.4 configuration that catches 2.5 API used without
    # its Interface gate. Exact version floors are covered by the build
    # configuration tests.
    name: System OpenColorIO 2.4 (fedora:43)
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      OCIO_RS_LINK: dynamic
    steps:
      - name: Install native dependencies
        run: dnf install -y gcc-c++ git pkgconf-pkg-config OpenColorIO-devel rust cargo

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test against the system OpenColorIO
        # Real-OCIO suites exercise process-global config/env/cache paths,
        # so run serially like the bundled job.
        run: cargo test --workspace --no-default-features --features system -- --test-threads=1

      - name: Test examples
        run: cargo test --examples --no-default-features --features system

      - name: Verify distribution shared-library processing
        run: cargo run --example native_smoke --no-default-features --features system

      - name: Check v2_5 is rejected by a 2.4 install
        run: |
          if cargo check -p ocio-sys --no-default-features --features system,v2_5; then
            echo "the v2_5 feature built against OpenColorIO 2.4: version gating is broken"
            exit 1
          fi

  minimum-ocio:
    name: Minimum OpenColorIO (${{ matrix.ocio }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OCIO_SOURCE_DIR: ${{ github.workspace }}/third_party/OpenColorIO
    strategy:
      fail-fast: false
      matrix:
        include:
          - ocio: 2.4.1
            features: bundled
          - ocio: 2.5.1
            features: bundled,v2_5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build

      - name: Select exact OpenColorIO source
        run: |
          git -C third_party/OpenColorIO fetch --depth=1 origin \
            "refs/tags/v${{ matrix.ocio }}:refs/tags/v${{ matrix.ocio }}"
          git -C third_party/OpenColorIO checkout --detach "v${{ matrix.ocio }}"

      - name: Test exact minimum
        run: cargo test --workspace --no-default-features --features "${{ matrix.features }}" -- --test-threads=1

  bundled:
    name: Bundled (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build

      - name: Test with bundled OCIO
        # The real-OCIO bundled suite exercises process-global config/env/cache
        # paths, so run it serially for deterministic CI behavior.
        run: cargo test --workspace --no-default-features --features bundled,v2_5 -- --test-threads=1

  ocio-2-6:
    name: OpenColorIO 2.6.0 compatibility
    # Changes to the bridge must be tested against the newest supported native
    # API before merging, not only in the scheduled/dispatch matrix.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OCIO_SOURCE_DIR: ${{ github.workspace }}/third_party/OpenColorIO
      OCIO_RS_TEST_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build
      - name: Select OpenColorIO 2.6.0
        run: |
          git -C third_party/OpenColorIO fetch --depth=1 origin tag v2.6.0
          git -C third_party/OpenColorIO checkout --detach v2.6.0
      - name: Test representative 2.6 behavior
        if: github.event_name == 'pull_request'
        run: |
          cargo test --locked --no-default-features --features bundled,v2_6 \
            --test ocio_2_6_behavior_tests --test gpu_shader_desc_behavior_tests \
            --test app_helpers_behavior_tests --test const_current_config_behavior_tests \
            --test processor_behavior_tests \
            -- --test-threads=1
      - name: Test all interface levels
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          cargo run --locked --bin check_parity -- --check-l3
          cargo test --workspace --no-default-features --features bundled -- --test-threads=1
          cargo test --workspace --no-default-features --features bundled,v2_5 -- --test-threads=1
          cargo test --workspace --no-default-features --features bundled,v2_6 -- --test-threads=1
      - name: Verify installed-library discovery and runtime
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          prefix="$RUNNER_TEMP/ocio-2.6-install"
          build="$RUNNER_TEMP/ocio-2.6-build"
          cmake -S "$OCIO_SOURCE_DIR" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_SHARED_LIBS=ON -DOCIO_INSTALL_EXT_PACKAGES=ALL \
            -DOCIO_BUILD_APPS=OFF -DOCIO_BUILD_PYTHON=OFF -DOCIO_BUILD_TESTS=OFF
          cmake --build "$build" --target install --parallel 2
          export OCIO_INSTALL_DIR="$prefix"
          export OCIO_RS_LINK=dynamic
          export LD_LIBRARY_PATH="$prefix/lib:$prefix/lib64:$build/ext/dist/lib:$build/ext/dist/lib64"
          cargo test --locked --no-default-features --features system,v2_6 \
            --test app_helpers_behavior_tests --test ocio_2_6_behavior_tests \
            --test runtime_helpers_behavior_tests -- --test-threads=1

  bundled-zlib-ng:
    name: Bundled with system zlib-ng (Arch Linux)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    steps:
      - name: Install native dependencies
        run: pacman -Syu --noconfirm git cmake ninja rust zlib-ng

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test hermetic bundled dependency selection
        # The host deliberately provides zlib-ng. The bundled OpenColorIO
        # build must still use the classic zlib archive it builds itself.
        run: cargo test --workspace --no-default-features --features bundled,v2_5 -- --test-threads=1
