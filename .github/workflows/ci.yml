name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    name: Stub (${{ matrix.os }})
    # Pin the mode: the build now probes for an installed OpenColorIO by
    # default, so without this a runner image that gains OCIO would silently
    # stop exercising the stub.
    env:
      OCIO_RS_ENABLE_REAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Test
        run: cargo test --workspace --no-default-features

      - name: Test examples
        run: cargo test --examples --no-default-features

  stub-audit:
    name: Stub Audit (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      OCIO_RS_ENABLE_REAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --no-default-features

      - name: Parity
        run: cargo run --bin check_parity --quiet -- --check-l3

      - name: Package
        run: cargo package -p ocio-sys --allow-dirty

  system-ocio:
    # The one configuration that can catch API used without its version gate:
    # a real install of the oldest supported OpenColorIO. The bundled build
    # always carries the newest API and cannot. Fedora 43 ships 2.4.2.
    name: System OpenColorIO 2.4 (fedora:43)
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      # State the intent so a failed probe fails the job instead of
      # silently falling back to the stub.
      OCIO_RS_ENABLE_REAL: 1
    steps:
      - name: Install native dependencies
        run: dnf install -y gcc-c++ git pkgconf-pkg-config OpenColorIO-devel rust cargo

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test against the system OpenColorIO
        # Real-OCIO suites exercise process-global config/env/cache paths,
        # so run serially like the bundled job.
        run: cargo test --workspace -- --test-threads=1

      - name: Test examples
        run: cargo test --examples

      - name: Check v2_5 is rejected by a 2.4 install
        run: |
          if cargo check -p ocio-sys --features v2_5; then
            echo "the v2_5 feature built against OpenColorIO 2.4: version gating is broken"
            exit 1
          fi

  bundled:
    name: Bundled (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build

      # system-deps resolves the internally-built OpenColorIO through its
      # generated .pc file, so the bundled path needs a pkg-config binary;
      # the Windows runner image is the only one that doesn't ship one.
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        run: choco install pkgconfiglite --no-progress -y

      - name: Test with bundled OCIO
        # The real-OCIO bundled suite exercises process-global config/env/cache
        # paths, so run it serially for deterministic CI behavior.
        run: cargo test --workspace --features bundled -- --test-threads=1
