name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    name: Stub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Test
        run: cargo test --workspace --no-default-features

      - name: Test examples
        run: cargo test --examples --no-default-features

  stub-audit:
    name: Stub Audit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --no-default-features

      - name: Parity
        run: cargo run --bin check_parity --quiet -- --check-l3

      - name: Package
        run: cargo package -p ocio-sys --allow-dirty

  bundled:
    name: Bundled (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ cmake ninja-build

      # system-deps resolves the internally-built OpenColorIO through its
      # generated .pc file, so the bundled path needs a pkg-config binary;
      # the Windows runner image is the only one that doesn't ship one.
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        run: choco install pkgconfiglite --no-progress -y

      - name: Test with bundled OCIO
        # The real-OCIO bundled suite exercises process-global config/env/cache
        # paths, so run it serially for deterministic CI behavior.
        run: cargo test --workspace --features bundled -- --test-threads=1
